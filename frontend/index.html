  <script>
    /* set the theme before first paint */
    (function () {
      try {
        var t = localStorage.getItem('viva-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    })();
  </script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">

  <a class="skip" href="#app">Skip to content</a>

      <span class="chip" id="sim-chip" title="This page runs against a built-in simulator. No server, no model and no transcription is contacted.">Simulated<span class="more"> backend</span></span>

      <a class="avatar" href="portfolio.html" aria-label="Your portfolio" title="Your portfolio"><img src="assets/avatar.jpg" alt="" width="40" height="40"></a>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="foot">
    <span>Explain your own change. The score reads your words only.</span>
