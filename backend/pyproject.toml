[project]
name = "viva-server"
version = "0.1.0"
description = "Viva: the decision check behind a pull request, with the answer key and the scoring on the server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9",
    "anthropic>=1.11,<2",
    "httpx>=0.27,<1",
    "pyjwt[crypto]>=2.8,<3",
]

[project.optional-dependencies]
# Speech-to-text on the server. faster-whisper 1.2 passes metadata_errors to av.open, which av 19 rejects; av 15 works.
stt = ["faster-whisper>=1.1,<2", "av>=12,<16"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
