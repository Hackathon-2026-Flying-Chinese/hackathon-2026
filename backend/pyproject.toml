[project]
name = "viva-server"
version = "0.1.0"
description = "Viva: the decision check behind a pull request, with the answer key and the scoring on the server"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.9", "anthropic>=1.11,<2"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
